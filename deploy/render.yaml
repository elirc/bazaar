services:
  - type: web
    name: bazaar-storefront
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bazaar/storefront build
    startCommand: pnpm --filter @bazaar/storefront start
    healthCheckPath: /api/health
  - type: web
    name: bazaar-admin
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bazaar/admin build
    startCommand: pnpm --filter @bazaar/admin start
    healthCheckPath: /api/health
  - type: web
    name: bazaar-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bazaar/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
  - type: worker
    name: bazaar-worker
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @bazaar/worker build
    startCommand: node apps/worker/dist/index.js
